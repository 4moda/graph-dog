name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix deliberately: path normalization and line
        # endings are the two places a corpus could stop being portable.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.18", "24"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  eval:
    # Retrieval quality is measured, not asserted. This runs GraphDog's own
    # dataset against its own docs and fails if any metric fell below the
    # checked-in baseline -- so a change that quietly makes search worse fails
    # here rather than being noticed a month later.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm

      - run: npm ci
      - name: Measure retrieval quality against the baseline
        run: npm run eval -- --baseline eval/baseline.json

  smoke:
    # Proves the published entry points actually work, not just the sources.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Build and query a corpus end to end
        run: |
          set -euo pipefail
          mkdir -p /tmp/smoke/docs
          printf '# Access Token\n\nTokens are JWT values signed with ES256.\n' > /tmp/smoke/docs/token.md
          printf '# Keys\n\nPublic keys are published at the JWKS endpoint.\n' > /tmp/smoke/docs/keys.md

          cd /tmp/smoke
          CLI="node $GITHUB_WORKSPACE/packages/cli/dist/main.js"
          $CLI init demo --source ./docs
          $CLI build
          $CLI search "JWKS" --json | node -e '
            const chunks = [];
            process.stdin.on("data", (c) => chunks.push(c));
            process.stdin.on("end", () => {
              const result = JSON.parse(chunks.join(""));
              if (result.hits.length === 0) throw new Error("expected a hit");
              if (!result.hits[0].read_ref.includes("#L")) throw new Error("missing line range");
              console.log("smoke ok:", result.hits[0].read_ref);
            });
          '
          $CLI read "$($CLI search 'JWKS' --json | node -e '
            const chunks = [];
            process.stdin.on("data", (c) => chunks.push(c));
            process.stdin.on("end", () => process.stdout.write(JSON.parse(chunks.join("")).hits[0].read_ref));
          ')"

      - name: Export, inspect with tar, import elsewhere, search
        run: |
          set -euo pipefail
          CLI="node $GITHUB_WORKSPACE/packages/cli/dist/main.js"
          cd /tmp/smoke
          $CLI export --out /tmp/smoke/demo.gdog
          # An ordinary tar archive, listable before anyone imports it.
          test "$(tar -tzf /tmp/smoke/demo.gdog | tr '\n' ' ')" = "manifest.json graphdog.json corpus.sqlite3 "
          export GRAPHDOG_HOME=/tmp/smoke-home
          mkdir -p /tmp/elsewhere && cd /tmp/elsewhere
          $CLI import /tmp/smoke/demo.gdog --as imported
          $CLI search "JWKS" --corpus imported --json | node -e '
            const chunks = [];
            process.stdin.on("data", (c) => chunks.push(c));
            process.stdin.on("end", () => {
              const result = JSON.parse(chunks.join(""));
              if (result.hits.length === 0) throw new Error("imported corpus returned no hits");
              console.log("round trip ok:", result.hits[0].read_ref);
            });
          '

      - name: Exit code for an unanswerable query is 7
        run: |
          cd /tmp/smoke
          set +e
          node "$GITHUB_WORKSPACE/packages/cli/dist/main.js" search "quantum chromodynamics"
          code=$?
          set -e
          test "$code" -eq 7 || { echo "expected exit 7, got $code"; exit 1; }

      - name: A breached evaluation gate exits 8
        run: |
          cd "$GITHUB_WORKSPACE"
          set +e
          npm run eval --silent -- --fail-under precision=0.99 >/dev/null 2>&1
          code=$?
          set -e
          test "$code" -eq 8 || { echo "expected exit 8, got $code"; exit 1; }
